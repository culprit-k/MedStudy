plugins {
    id 'com.android.application'
}

android {
    namespace 'org.medstudy.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'org.medstudy.mobile'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
        }
    }
}
