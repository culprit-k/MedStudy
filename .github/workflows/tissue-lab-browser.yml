name: Tissue Lab Browser Smoke

on:
  pull_request:
    paths:
      - "components/realistic_tissue_interaction_lab.html"
      - "components/tissue_physics_engine.js"
      - "components/anatomy_collision_engine.js"
      - "tests/tissue_lab_browser.spec.cjs"
      - "playwright.config.cjs"
      - ".github/workflows/tissue-lab-browser.yml"
  push:
    branches: ["main"]
    paths:
      - "components/realistic_tissue_interaction_lab.html"
      - "components/tissue_physics_engine.js"
      - "components/anatomy_collision_engine.js"
      - "tests/tissue_lab_browser.spec.cjs"
      - "playwright.config.cjs"
      - ".github/workflows/tissue-lab-browser.yml"
  workflow_dispatch:

jobs:
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Playwright test runner
        run: |
          npm init -y
          npm install --no-save @playwright/test@1.55.0
      - name: Install Chromium and system dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        env:
          CI: "true"
        run: npx playwright test --config=playwright.config.cjs
